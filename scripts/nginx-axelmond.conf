map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream nodejs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name perfacademy.ma www.perfacademy.ma axelmond.com www.axelmond.com 167.233.62.125 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name perfacademy.ma www.perfacademy.ma axelmond.com www.axelmond.com 167.233.62.125 _;

    ssl_certificate /etc/letsencrypt/live/perfacademy.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perfacademy.ma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64M;

    root /var/www/axelmond/dist;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Vite assets directly from disk (1 year immutable cache)
    location /assets/ {
        alias /var/www/axelmond/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static images and icons directly from disk
    location ~* \.(ico|png|jpg|jpeg|svg|webp|gif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
        try_files $uri @node;
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @node;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @node;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @node;
    }

    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache";
        try_files $uri @node;
    }

    # Block access to server code, sourcemaps, env files
    location ~* \.(map|env|cjs|ts|tsx)$ {
        return 404;
    }

    location / {
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
